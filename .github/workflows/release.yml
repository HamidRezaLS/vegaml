name: Release

# Tag a commit v0.1.0 and push it: this builds the distributions, checks the version matches the tag,
# and attaches them to a GitHub Release.
#
# Publishing to PyPI is deliberately NOT wired up here. When it is wanted, add a Trusted Publisher on
# PyPI (Publishing -> owner NandhaKishorM, repo vegaml, workflow release.yml, environment pypi) and a
# job with `permissions: id-token: write` calling pypa/gh-action-pypi-publish. Trusted publishing
# means no API token ever lives in GitHub secrets, which is why no token is configured now.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  USE_TF: "0"
  USE_TORCH: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip build twine
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,vision]"

      - name: Tests must pass before anything is built
        run: python -m pytest -q

      - name: Build
        run: python -m build

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')   # workflow_dispatch has no tag to match
        run: |
          pkg=$(python -c "import re;print(re.search(r'version = \"(.*)\"', open('pyproject.toml').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject=$pkg tag=$tag"
          test "$pkg" = "$tag" || { echo "::error::pyproject version $pkg does not match tag $tag"; exit 1; }

      - run: python -m twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  github_release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: dist/*
          generate_release_notes: true
