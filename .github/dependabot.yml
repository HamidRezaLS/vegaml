version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]

  # Actions are the other half of the supply chain: a compromised action runs with the workflow's
  # token. Keep them current, and keep third-party ones pinned to a SHA.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies]
